spring.application.name=medical-records-service
spring.datasource.url=${Database_Host}
spring.datasource.username=${Database_Username}
spring.datasource.password=${Database_Password}

server.port=8087

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.devtools.restart.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File storage directory - use absolute path or environment variable
# For development: set FILE_UPLOAD_DIR=F:/SDGP - Arogya/Arogya-Backend/medical-records-service/uploads/test-results
# For production: set FILE_UPLOAD_DIR=/var/app/uploads/test-results (Linux) or appropriate path
file.upload-dir=${FILE_UPLOAD_DIR:${user.dir}/uploads/test-results}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.compatibility-verifier.enabled=false
