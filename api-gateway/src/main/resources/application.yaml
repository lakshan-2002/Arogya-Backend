server:
  port: 8090

jwt:
  secret: ${JWT_Secret_Key}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  application:
    name: API-GATEWAY

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "https://arogya-mobile-clinic.me"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/roles/**, /users/**, /admin_profile/**, /doctor_profile/**,
                  /patient_profile/**, /technician_profile/**
              filters:
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 2
                  redis-rate-limiter.burstCapacity: 4
                  redis-rate-limiter.requestedTokens: 1
                  key-resolver: "#{@ipKeyResolver}"

            - id: clinic-service
              uri: lb://CLINIC-SERVICE
              predicates:
                - Path=/clinics/**, /clinic_doctors/**
              filters:
              - name: JwtAuthentication
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 2
                  redis-rate-limiter.burstCapacity: 4
                  redis-rate-limiter.requestedTokens: 1
                  key-resolver: "#{@ipKeyResolver}"

            - id: queue-service
              uri: lb://QUEUE-SERVICE
              predicates:
                - Path=/queue/**
              filters:
              - name: JwtAuthentication
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 2
                  redis-rate-limiter.burstCapacity: 4
                  redis-rate-limiter.requestedTokens: 1
                  key-resolver: "#{@ipKeyResolver}"

            - id: consultation-service
              uri: lb://CONSULTATION-SERVICE
              predicates:
                - Path=/consultations/**, /lab-tests/**
              filters:
              - name: JwtAuthentication
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 2
                  redis-rate-limiter.burstCapacity: 4
                  redis-rate-limiter.requestedTokens: 1
                  key-resolver: "#{@ipKeyResolver}"

            - id: medical-records-service
              uri: lb://MEDICAL-RECORDS-SERVICE
              predicates:
                - Path=/test-results/**
              filters:
              - name: JwtAuthentication
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 2
                  redis-rate-limiter.burstCapacity: 4
                  redis-rate-limiter.requestedTokens: 1
                  key-resolver: "#{@ipKeyResolver}"




eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
